version: '3'

vars:
  PIO_ENV: xiao_c3

tasks:
  tools:
    desc: Install uv tools
    cmds:
      - 'uv tool install platformio --with pip --force'
      
  init:
    desc: Initialize the repo
    cmds:
      - '[ -f config/Config.h ] || cp config/Config.h.sample config/Config.h'
      - '[ -f config/Certificate.h ] || cp config/Certificate.h.sample config/Certificate.h'
      - '[ -f .env ] || cp .env.example .env'
      - 'git config core.hooksPath .githooks'


  default:
    cmds:
      - task -l
    silent: true
  # default:
  #   desc: Run the build task
  #   cmds:
  #     - task: build

  install-toolchain:
    desc: Install the platformio toolchain manually
    cmds:
      - ./scripts/install_toolchain.sh

  build:
    desc: Build the firmware
    deps: [install-toolchain]
    cmds:
      - pio run -e {{.PIO_ENV}}

  upload:
    desc: Upload/flash the firmware to the device
    cmds:
      - pio run -t upload -e {{.PIO_ENV}}

  flash-release:
    desc: Download and flash the latest GitHub release
    cmds:
      - ./scripts/flash.sh {{.PIO_ENV}}

  eau:
    desc: Erase flash and upload firmware
    cmds:
      - pio run -t erase -e {{.PIO_ENV}}
      - pio run -t upload -e {{.PIO_ENV}}

  monitor:
    desc: Open the serial monitor
    cmds:
      - pio device monitor

  euam:
    desc: Erase, upload, and monitor the device
    cmds:
      - task: eau
      - task: monitor

  uam:
    desc: Upload and monitor the device
    cmds:
      - task: upload
      - task: monitor

  read-mac:
    desc: Read the MAC address of the ESP device
    cmds:
      - pio pkg exec -p tool-esptoolpy -- esptool.py --port /dev/ttyACM0 read_mac

  clean:
    desc: Clean build artifacts
    cmds:
      - pio run -t clean -e {{.PIO_ENV}}

  lint-yaml:
    desc: Lint YAML files
    cmds:
      - yamllint-rs .

  lint-markdown:
    desc: Lint Markdown files
    cmds:
      - rumdl check .

  test:native:
    desc: Run native PlatformIO unit tests
    cmds:
      - pio test -e native

  check:
    desc: Run static code analysis
    cmds:
      - pio check

  test:regression:
    desc: Run python regression tests against upstream codebase
    cmds:
      - uv run python test/test_regression.py

  test:ci:
    desc: Run CI build script
    cmds:
      - ./scripts/ci

  test:
    desc: Run all tests
    cmds:
      - task: test:native
      - task: test:regression

  coverage:report:
    desc: Show coverage report
    cmds:
      - task: test:native
        ignore_error: true
      - lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
      - lcov --remove lcov_raw.info '*/.pio/*' '*/test/*' '/usr/*' -o lcov.info --rc branch_coverage=1 --ignore-errors source,empty
      - lcov --list lcov.info --ignore-errors empty,empty
      - defer: rm -f lcov_raw.info lcov.info
      
  coverage:upload:
    desc: Generate and upload coverage report to Coveralls.io
    dotenv: ['.env']
    preconditions:
      - sh: 'test -n "$COVERALLS_REPO_TOKEN"'
        msg: "COVERALLS_REPO_TOKEN is not set. Please add it to your .env file."
    cmds:
      # 1. Run native tests to output coverage data
      - task: test:native
        ignore_error: true
      # 2. Extract and capture raw code coverage reports
      - lcov --capture --base-directory . --directory .pio/build/native/ --output-file lcov_raw.info --rc branch_coverage=1 --ignore-errors "gcov,source"
      # 3. Clean up the report by filtering out system and test files
      - lcov --remove lcov_raw.info '*/.pio/*' '*/test/*' '/usr/*' -o lcov.info --rc branch_coverage=1 --ignore-errors source,empty
      # 4. Upload to coveralls using the CLI binary
      - coveralls report lcov.info -n -r $COVERALLS_REPO_TOKEN
      # 5. Clean up temporary local files
      - defer: rm lcov_raw.info lcov.info
