version: '3'

vars:
  PIO_ENV: xiao_c3

tasks:
  tools:
    desc: Install uv tools
    cmds:
      - 'uv tool install platformio --with pip --force'
      
  init:
    desc: Initialize the repo
    cmds:
      - '[ -f config/Config.h ] || cp config/Config.h.sample config/Config.h'
      - '[ -f config/Certificate.h ] || cp config/Certificate.h.sample config/Certificate.h'
      - 'git config core.hooksPath .githooks'


  default:
    cmds:
      - task -l
    silent: true
  # default:
  #   desc: Run the build task
  #   cmds:
  #     - task: build

  install-toolchain:
    desc: Install the platformio toolchain manually
    cmds:
      - ./script/install_toolchain.sh

  build:
    desc: Build the firmware
    deps: [install-toolchain]
    cmds:
      - pio run -e {{.PIO_ENV}}

  upload:
    desc: Upload/flash the firmware to the device
    cmds:
      - pio run -t upload -e {{.PIO_ENV}}

  eau:
    desc: Erase flash and upload firmware
    cmds:
      - pio run -t erase -e {{.PIO_ENV}}
      - pio run -t upload -e {{.PIO_ENV}}

  monitor:
    desc: Open the serial monitor
    cmds:
      - pio device monitor

  euam:
    desc: Erase, upload, and monitor the device
    cmds:
      - task: eau
      - task: monitor

  uam:
    desc: Upload and monitor the device
    cmds:
      - task: upload
      - task: monitor

  read-mac:
    desc: Read the MAC address of the ESP device
    cmds:
      - pio pkg exec -p tool-esptoolpy -- esptool.py --port /dev/ttyACM0 read_mac

  clean:
    desc: Clean build artifacts
    cmds:
      - pio run -t clean -e {{.PIO_ENV}}

  lint-yaml:
    desc: Lint YAML files
    cmds:
      - yamllint-rs .

  lint-markdown:
    desc: Lint Markdown files
    cmds:
      - rumdl check .

  test:native:
    desc: Run native PlatformIO unit tests
    cmds:
      - pio test -e native

  test:regression:
    desc: Run python regression tests against upstream codebase
    cmds:
      - uv run python test/test_regression.py

  test:ci:
    desc: Run CI build script
    cmds:
      - ./script/ci

  test:
    desc: Run all tests
    cmds:
      - task: test:native
      - task: test:regression
