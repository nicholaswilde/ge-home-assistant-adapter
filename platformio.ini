[platformio]

[env]
framework = arduino

build_flags =
  -std=gnu11
  -Iconfig

lib_deps =
  knolleary/PubSubClient@^2.8
  arduino-libraries/NTPClient@^3.2.1
  geappliances/home-assistant-bridge@^1.3.0
  tzapu/WiFiManager@^2.0.17

build_src_flags =
  -Wall
  -Wextra
  -Werror

[env:xiao_c3]
platform = espressif32@^6.9.0
platform_packages = toolchain-riscv32-esp@symlink:///home/nicholas/.platformio/packages/toolchain-riscv32-esp
board = seeed_xiao_esp32c3
board_build.partitions = min_spiffs.csv
upload_protocol = esptool
debug_tool = esp-builtin

build_unflags =
  ${env.build_unflags}
  -std=gnu99

build_flags =
  ${env.build_flags}
  -DLED_HEARTBEAT=D0
  -DLED_MQTT=D1
  -DLED_WIFI=D2

check_skip_packages = yes
check_flags =
  cppcheck: --suppress=unusedFunction

[env:native]
platform = native
test_framework = unity
framework =
lib_deps =
  ArduinoFake
build_flags =
  -std=gnu++11
  -Iconfig
  -I test/test_native/mocks
